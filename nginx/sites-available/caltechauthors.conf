# TEMPLATE. nginx-deploy.bash renders this file and installs it as
# /etc/nginx/sites-available/<site-name>.conf, linked from sites-enabled. It
# replaces two names written between @ signs: SERVER_NAME (the host's name, for
# server_name; "_" is a catch-all) and REPO_DIR (the checkout: the legacy
# redirect map and the static files).
# TLS is not in this file: snippets/caltechauthors-tls.conf holds the certificate
# pair, and the script writes it from nginx/tls/ (--tls letsencrypt|self-signed).
# What is used below (the log_format, the limit zones, the IIIF cache) is defined
# in conf.d/, which nginx includes before sites-enabled.
#
# Legacy URL redirects (EPrints-era paths -> their current locations). This
# file only defines the $redirect_uri map, so it has to be included at http
# level, outside any server block -- exactly where production's pre-Granian
# config had it. Dropped by accident in the move to this config: verified live
# 2026-09-10 on caltechauthors-v13 that /cgi/oai2, /perl/oai2 and
# /view/person-az/*.html all returned 404 instead of their 301s, with the
# 12MB map file sitting unreferenced in the clone. Absolute path because the
# map lives in the repo checkout rather than under /etc/nginx; nginx's master
# reads its config as root at startup, so the clone's ownership is fine.
include @REPO_DIR@/redirect-map.conf;

# nginx 1.24's mime.types (Ubuntu) has no entry for .mjs, so pdf.js's seven ES
# modules under /static/js/pdfjs fall through to nginx.conf's
# "default_type application/octet-stream" and Firefox refuses to load them:
# "Loading module from ... was blocked because of a disallowed MIME type
# (application/octet-stream)". Reported live 2026-09-10, after the
# X-Frame-Options fix -- the PDF previewer had two independent faults, and
# fixing the header alone was necessary but not sufficient.
#
# Placed here, at http level, deliberately. nginx.conf's own
# "include /etc/nginx/mime.types" is a types block in this same context, and
# repeated types blocks in one context add to the map. A types block in a
# nested context (server or location) REPLACES the inherited map instead, so
# putting this inside "location /static" would serve every other extension
# there as octet-stream. Verify after any change to this block by curling a
# .mjs *and* a control .css -- see verify_rdm_boot.bash.
#
# .wasm is already mapped by the distro file; .map, .ttf, .bcmap and .xsl are
# not, and are left alone. Only .mjs is fetched in a context that enforces its
# MIME type. Note that nginx's map sends .ts to video/mp2t, which is right for
# a transport stream and wrong for TypeScript -- irrelevant here only because
# nothing loads the .ts sources in the browser.
types {
    text/javascript mjs;
}

server {
  server_name @SERVER_NAME@;
  listen 80;
  listen [::]:80;
  # Both server blocks set the access log themselves, so every request lands in
  # the one extended format (the format is defined in conf.d/caltechauthors_log.conf).
  access_log /var/log/nginx/access.log caltechauthors_bots;
  error_log /var/log/nginx/error.log warn;
  return 301 https://$host$request_uri;
}

server {
  server_name @SERVER_NAME@;
  include snippets/caltechauthors-tls.conf;
  include snippets/ssl-params.conf;
  add_header Strict-Transport-Security "max-age=15768000";
  add_header X-Request-ID $request_id;
  listen 443 ssl;
  listen [::]:443 ssl;
  access_log /var/log/nginx/access.log caltechauthors_bots;
  error_log /var/log/nginx/error.log warn;

  proxy_request_buffering off;
  proxy_buffering off;
  proxy_http_version 1.1;

  location / {
    proxy_pass http://127.0.0.1:5000;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header X-Request-ID $request_id;
    proxy_hide_header X-Session-ID;
    proxy_hide_header X-User-ID;
    client_max_body_size 100m;
  }
  # Real bug found via live testing 2026-07-27 (Step 7 verification):
  # every /api/* request 404'd, including paths with confirmed
  # indexed data (e.g. /api/vocabularies/languages) -- ruled out
  # both "no demo data" and "OpenSearch still indexing" (a 200
  # with an empty result, or a 500, would look different; this was
  # a bare Werkzeug "no URL rule" 404). Root cause: confirmed live
  # that invenio_app.wsgi_rest:application (port 5001, the REST-
  # only Granian process) mounts every API blueprint at the root
  # ("/records" returns 200 with real data), NOT under "/api".
  # Fixed then by having nginx strip the prefix, via a trailing
  # slash on proxy_pass ("http://127.0.0.1:5001/").
  #
  # That fix is superseded as of 2026-09-10. Stripping the prefix
  # here gets PATH_INFO right but leaves SCRIPT_NAME empty, so the
  # REST app does not know where it is mounted and every path it
  # generates itself comes out without "/api". Verified live on
  # caltechauthors-v13: GET /api/banners?q=&page=1&size=20 returns
  # Werkzeug's strict-slashes 308 for the "/banners/" route with
  # "Location: https://authors.library.caltech.edu/banners/?..." --
  # the browser follows that into the UI app on port 5000 and gets
  # a 404. That is what broke /administration/banners. It is a
  # class of bug, not one endpoint: any redirect or url_for() the
  # REST app emits loses the prefix.
  #
  # uWSGI never had this. uwsgi_rest.ini (see the pre-Granian
  # config on main) carried
  #   mount = /api=invenio_app.wsgi_rest:application
  #   manage-script-name = true
  # which made uWSGI itself set SCRIPT_NAME=/api and strip it from
  # PATH_INFO. Granian's equivalent is "--url-path-prefix /api",
  # now in rdm_rest.service, so nginx forwards the full unmodified
  # URI again -- hence the deliberate absence of a trailing slash
  # below. The two settings are a matched pair: change one without
  # the other and every /api request breaks.
  location /api {
    proxy_pass http://127.0.0.1:5001;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header X-Request-ID $request_id;
    proxy_hide_header X-Session-ID;
    proxy_hide_header X-User-ID;
    client_max_body_size 100m;
    # Global concurrency cap, zone in caltechauthors_limits.conf.
    limit_conn api_conc 24;
  }
  # IIIF renders spawn a Ghostscript process each, so they get their own,
  # tighter cap on top of the /api one. Same proxy settings as location /api
  # (see the matched-pair note above): the full URI is forwarded unchanged.
  location ^~ /api/iiif/ {
    proxy_pass http://127.0.0.1:5001;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header X-Request-ID $request_id;
    proxy_hide_header X-Session-ID;
    proxy_hide_header X-User-ID;
    client_max_body_size 100m;
    limit_conn api_conc 24;
    limit_conn iiif_conc 6;
    # The server block sets proxy_buffering off, and nginx will not cache an
    # unbuffered response. Turn it back on for this location only.
    proxy_buffering on;
    # Cache anonymous renders; concurrent requests for one URL share one render.
    # Renders take about a minute under load, so the read timeout and the lock
    # must outlast them or the response is cut off and never cached. Zone and
    # path are in conf.d/caltechauthors_cache.conf.
    proxy_cache iiif_cache;
    proxy_cache_key $scheme$host$request_uri;
    proxy_cache_lock on;
    proxy_cache_lock_timeout 120s;
    proxy_cache_lock_age 120s;
    proxy_cache_use_stale error timeout updating http_502 http_503 http_504;
    # Not on any cookie: every anonymous visitor to a page is given a "session"
    # cookie, so a cookie bypass excluded nearly all readers (2026-10-08: 2 HITs
    # in 31 hours). Instead never STORE a response the application marked as
    # authenticated: Invenio sends X-User-ID on those (hidden from clients above),
    # which nginx reads as $upstream_http_x_user_id.
    proxy_cache_bypass $http_authorization $arg_token $arg_access_token;
    proxy_no_cache $http_authorization $arg_token $arg_access_token $upstream_http_x_user_id;
    proxy_read_timeout 120s;
  }
  # Same matched pair as the block above. This location used to
  # drop the /api/ prefix with a capture group, because a regex
  # location can't use proxy_pass's trailing-slash prefix-strip
  # trick. With Granian's --url-path-prefix owning the strip there
  # is nothing to rewrite, so the capture group is gone and this
  # forwards the full URI like every other location. Optional
  # trailing /<part-number> and trailing slash match production's
  # pre-Granian config (multipart file-content requests carry a
  # numeric part suffix).
  location ~ ^/api/records/.+/draft/files/.+/content(?:/[0-9]+)?/?$ {
    gzip off;
    proxy_pass http://127.0.0.1:5001;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header X-Request-ID $request_id;
    proxy_hide_header X-Session-ID;
    proxy_hide_header X-User-ID;
    client_max_body_size 500G;
  }
  # Static content served directly by nginx (the path reflects uv's venv
  # layout, not the old Pipenv virtualenvs path).
  location /static {
    alias @REPO_DIR@/.venv/var/instance/static;
    autoindex off;
    # nginx serves these itself, so the application never sees them and
    # Talisman never gets to set a header on them. A location-level add_header
    # REPLACES every inherited one rather than adding to it, so the two
    # server-level headers have to be restated here or they are silently lost
    # for /static. X-Frame-Options is deliberately absent: framing a
    # stylesheet or a script is meaningless, and it is the application's
    # business on the responses where it matters.
    add_header Strict-Transport-Security "max-age=15768000";
    add_header X-Request-ID $request_id;
    add_header X-Content-Type-Options nosniff;
  }

  # Serve the legacy redirects from the $redirect_uri map included at the top
  # of this file. Server level, so it is evaluated before a location is
  # chosen, and placed after the locations to match where production's
  # pre-Granian config had it. The map yields an empty string for any URI it
  # doesn't know and an empty value is falsy, so this is a no-op for every
  # current URL.
  if ($redirect_uri) {
    return 301 $redirect_uri;
  }
}

