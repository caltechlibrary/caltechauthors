# Global concurrency caps for the API, to keep a flood of requests from
# saturating the REST workers and CPU (issue #168 follow-up, 2026-10-06).
#
# Why a global cap and not a per-IP limit: the abusive traffic comes from
# well over a thousand addresses at a few requests each, so no per-address
# rule trips. What is scarce is server capacity (about a dozen REST worker
# threads, 8 cores, and one Ghostscript process per IIIF render), so the cap
# is on total requests in flight. Requests over the cap get a fast 429
# instead of queueing until nginx times out at 504.
#
# Installed by nginx-deploy.bash as /etc/nginx/conf.d/caltechauthors_limits.conf
# (http context). The site config (nginx/sites-available/caltechauthors.conf)
# uses the zones: "limit_conn api_conc 24;" in "location /api" and, in
# "location ^~ /api/iiif/", both api_conc and "limit_conn iiif_conc 6;".
# Rollback: nginx-deploy.bash rollback.
#
# Tuning: watch "limiting connections" lines in /var/log/nginx/error.log.
# To measure without rejecting, add "limit_conn_dry_run on;" below.
#
# Campus addresses are exempt (empty key = not counted), so Library tools and
# harvesters inside 131.215.0.0/16 are never throttled. This relies on the
# real_ip change (cloudflare_real_ip.conf) so $remote_addr is the
# visitor, not a Cloudflare edge.

# geo, not map: redirect-map.conf (included from the site config, which loads
# after conf.d) sets map_hash_max_size, and nginx rejects that directive as
# "duplicate" if any map block was parsed before it. geo has no such limit.
# An empty key is not counted, which is how campus addresses are exempted.
geo $api_limit_key {
    default         "api";
    131.215.0.0/16  "";
}

geo $iiif_limit_key {
    default         "iiif";
    131.215.0.0/16  "";
}

limit_conn_zone $api_limit_key  zone=api_conc:64k;
limit_conn_zone $iiif_limit_key zone=iiif_conc:64k;

limit_conn_status 429;
limit_conn_log_level warn;
