# TLS protocol and session settings, for every --tls choice. nginx-deploy.bash
# installs this file as /etc/nginx/snippets/ssl-params.conf, which the site
# config includes next to snippets/caltechauthors-tls.conf. The DH parameters
# it names are written by cloud-init; the script requires them and stops if
# they are missing.
#
# This file used to be written by cloud-init alone, and the script only checked
# that it existed, so a host provisioned before a change here kept its old copy
# for good. authors.caltechlibrary.dev still carried the pre-2026-09-10 version
# on 2026-10-27, and its record file preview was broken by it (see below). Now
# diff reports a stale copy and apply replaces it, with a backup.
#
# This file deliberately carries no add_header. It used to end with
# "add_header X-Frame-Options DENY;" and
# "add_header X-Content-Type-Options nosniff;", which the application already
# sends via Talisman (APP_DEFAULT_SECURE_HEADERS in invenio.cfg, frame_options
# "sameorigin"). nginx's add_header appends rather than replaces, so every 2xx
# response carried two X-Frame-Options values -- "sameorigin" from the app and
# "DENY" from here. Browsers treat two different values as "invalid" and refuse
# to frame the document, which broke the record file preview (reported live on
# caltechauthors-v13, 2026-09-10; the response was confirmed to carry both
# headers). See DR-0005: the application owns the security headers, nginx does
# not duplicate a subset of them.
ssl_protocols TLSv1.2 TLSv1.3;
ssl_prefer_server_ciphers on;
ssl_dhparam /etc/nginx/dhparam.pem;
ssl_ciphers ECDHE-RSA-AES256-GCM-SHA512:DHE-RSA-AES256-GCM-SHA512:ECDHE-RSA-AES256-GCM-SHA384:DHE-RSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-SHA384;
ssl_ecdh_curve secp384r1;
ssl_session_cache shared:SSL:10m;
ssl_session_tickets off;
ssl_stapling off;
ssl_stapling_verify off;
resolver 127.0.0.53 valid=300s;
resolver_timeout 5s;
