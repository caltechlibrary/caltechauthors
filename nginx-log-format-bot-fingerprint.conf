# Extended access-log format for identifying automated traffic (issue #168).
#
# To enable on the server:
#   1. Copy this file to /etc/nginx/caltechauthors_log.conf. NOT into conf.d:
#      conf.d is included after nginx.conf's own access_log line, and a
#      log_format must be defined before it is used.
#   2. In /etc/nginx/nginx.conf (line 40) replace
#          access_log /var/log/nginx/access.log;
#      with
#          include /etc/nginx/caltechauthors_log.conf;
#   3. sudo nginx -t && sudo systemctl reload nginx
# Rollback: restore the original access_log line in nginx.conf, reload, and
# remove this file. (A backup of nginx.conf is kept as
# nginx.conf.bak-20261006-logformat.)
#
# Compatibility: the first nine fields are the stock "combined" format, so
# existing awk/grep over $1 (client), $4 (time), $7 (path), $9 (status) and the
# quoted user agent still work. New fields are appended after it.
#
# New fields:
#   rt / urt        total request time and upstream (RDM) response time, so
#                   slow endpoints are visible without the application log
#   cf_ray          Cloudflare request id. EMPTY means the request did not
#                   come through Cloudflare (the origin was hit directly)
#   cf_country      Cloudflare's country code for the client
#   peer            the connecting address before real_ip rewrote it
#                   (a Cloudflare edge, or the client itself if direct)
#   lang, ch_ua, ch_plat   Accept-Language and client-hint headers; scrapers
#                   often send none, or inconsistent ones
#   bot_score, ja3, ja4    Cloudflare bot score and TLS fingerprints. These are
#                   empty unless the campus Cloudflare plan adds them (the
#                   "bot protection headers" managed transform). Harmless
#                   when empty; asked of central IT in the request note.
#
# Cost: about 200 more bytes per line. At 400,000 to 700,000 requests a day
# that is roughly 80 to 140 MB a day before compression. logrotate already
# rotates and compresses daily; check free space on / (206 GB free on
# 2026-10-06) if retention is long.

log_format caltechauthors_bots
    '$remote_addr - $remote_user [$time_local] "$request" '
    '$status $body_bytes_sent "$http_referer" "$http_user_agent" '
    'rt=$request_time urt="$upstream_response_time" '
    'cf_ray="$http_cf_ray" cf_country="$http_cf_ipcountry" '
    'peer=$realip_remote_addr '
    'lang="$http_accept_language" ch_ua="$http_sec_ch_ua" '
    'ch_plat="$http_sec_ch_ua_platform" '
    'bot_score="$http_cf_bot_score" ja3="$http_cf_ja3_hash" ja4="$http_cf_ja4"';

access_log /var/log/nginx/access.log caltechauthors_bots;
