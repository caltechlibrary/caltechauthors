# Cache for anonymous IIIF renders (issue #168 follow-up, 2026-10-07).
#
# A 15-minute sample on 2026-10-07 showed 104 IIIF requests for 21 distinct
# URLs (99 of them PDF renders, each spawning a Ghostscript process taking
# about 55 seconds under load), 88 percent of which failed with 504 or 429.
# RDM marks these responses "Cache-Control: public, max-age=300", and nginx
# honours that, so no proxy_cache_valid override is set. A longer lifetime is
# possible once the log's cache= field shows what is wanted.
#
# Install: mkdir -p /var/cache/nginx/caltechauthors_iiif and chown it to the
# nginx user (www-data); copy this file to /etc/nginx/conf.d/caltechauthors_cache.conf
# (http context); use the site config in this repo, whose location ^~ /api/iiif/
# block names the zone, bypasses and does not store any request that carries a
# cookie, an Authorization header or a token argument (so only anonymous
# responses are ever cached) and turns proxy_buffering on (the server block sets
# it off, and nginx does not cache an unbuffered response). nginx -t, reload.
# Rollback: restore the previous site config, remove this file, nginx -t, reload.
#
# To clear the cache (for example after a takedown), delete the files under
# /var/cache/nginx/caltechauthors_iiif. Unused entries go after an hour and the
# directory is capped at 2 GB.
proxy_cache_path /var/cache/nginx/caltechauthors_iiif
                 levels=1:2 keys_zone=iiif_cache:10m max_size=2g
                 inactive=1h use_temp_path=off;
